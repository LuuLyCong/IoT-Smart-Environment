spring:
  application:
    name: iot-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/iotdb}
    username: ${SPRING_DATASOURCE_USERNAME:iotuser}
    password: ${SPRING_DATASOURCE_PASSWORD:iotpass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

mqtt:
  broker:
    url: ${MQTT_BROKER_URL:tcp://localhost:1883}
    client-id: spring-boot-backend-${random.uuid}
    username: ${MQTT_USERNAME:}
    password: ${MQTT_PASSWORD:}

jwt:
  secret: ${JWT_SECRET:this_is_a_very_secret_key_for_jwt_signing_which_needs_to_be_at_least_256_bits_long}
  expiration: 86400000 # 24 hours in ms

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

logging:
  level:
    root: INFO
    com.example.iot: DEBUG
